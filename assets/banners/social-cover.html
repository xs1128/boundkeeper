<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勞權濾網 — Social Cover</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: "Noto Sans TC", system-ui, sans-serif;
      background: linear-gradient(145deg, #f4f7f5 0%, #e4f2ed 45%, #d5ebe3 100%);
      color: #17332d;
    }
    .banner {
      width: 100%;
      height: 100%;
      padding: 72px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .top {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .logo {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      background: #136c5a;
      display: grid;
      place-items: center;
    }
    .logo svg { width: 52px; height: 52px; }
    .eyebrow {
      font-size: 28px;
      font-weight: 700;
      color: #136c5a;
      letter-spacing: 0.08em;
    }
    h1 {
      font-size: 92px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.05;
    }
    .tagline {
      margin-top: 24px;
      max-width: 820px;
      font-size: 34px;
      line-height: 1.45;
      color: #5f716c;
    }
    .footer {
      font-size: 22px;
      color: #136c5a;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="top">
      <div class="logo">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 9 35 14.5V23.5c0 7.2-4.6 12.8-11 14.8-6.4-2-11-7.6-11-14.8V14.5L24 9Z" fill="#e8f5f0"/>
          <path d="M15 21.5h18M15 25h14M15 28.5h10" stroke="#136c5a" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="eyebrow">給工作者的溝通助手</div>
    </div>
    <div>
      <h1>勞權濾網</h1>
      <p class="tagline">看懂主管訊息中的勞權風險 · 法規參考 · 回覆改進建議</p>
    </div>
    <p class="footer">一般資訊，非法律意見 · 本機儲存 · 隱私優先</p>
  </div>
</body>
</html>
